appId: com.skillupfesta.typingking.ai-leaderboard
productName: AI 타자왕을 이겨라 리더보드
directories:
  output: release-build/ai-leaderboard
files:
  - dist-renderer/**
  - dist-electron/**
  - package.json
asar: true
win:
