appId: com.thepmd.gscience.typingking.practice-leaderboard
productName: G-Science AI 타자왕 연습모드 리더보드
extraMetadata:
  typingKingEventProfile: geumcheon-2026
  typingKingVariant: practice-leaderboard
directories:
  output: release-build/geumcheon/practice-leaderboard
files:
  - dist-renderer/**
  - dist-electron/**
  - package.json
extraResources:
  - from: assets/ai_challenge
    to: assets/ai_challenge
    filter:
      - ai_boss_typing.png
      - ai_boss_victory.png
      - ai_boss_defeat.png
      - vs_badge.png
      - stage_badge_1.png
      - stage_badge_2.png
      - stage_badge_3.png
      - ai_title_compact.png
      - ai_title_oneline_trimmed.png
      - ai_challenge_title.png
  - from: events/geumcheon-2026
    to: events/geumcheon-2026
asar: true
win:
  icon: assets/icons/leaderboard_app_icon.ico
  signExecutable: false
  target:
    - target: portable
      arch:
        - x64
portable:
  artifactName: G-Science AI 타자왕_연습모드_리더보드.exe
